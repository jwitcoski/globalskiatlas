<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KJGNL3KJL0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-KJGNL3KJL0');
    </script>
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var legacy = p.get("resort");
        if (legacy && !p.get("world")) location.replace("./diorama.html?world=" + encodeURIComponent(legacy));
      })();
    </script>
    <title>Ski Game – Global Ski Atlas</title>
    <meta name="description" content="Pick a mapped ski resort, fly over its 3D diorama, then ski a trail in the browser." />
    <link rel="shortcut icon" href="/assets/logo.png?v=2" type="image/x-icon" />
    <link rel="canonical" href="https://globalskiatlas.com/playable/" />
    <meta property="og:title" content="Ski Game – Global Ski Atlas" />
    <meta property="og:description" content="Pick a mapped ski resort, fly over its 3D diorama, then ski a trail in the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://globalskiatlas.com/playable/" />
    <meta property="og:image" content="https://globalskiatlas.com/assets/og-banner.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
      :root { --ink: #23303a; --paper: #fbfaf5; --tab: #7fb0e3; --accent: #f0c24a; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #8ccac4; color: var(--ink); font-family: "Patrick Hand", "Comic Sans MS", cursive; }
      #map { position: absolute; inset: 0; }
      .card { position: absolute; z-index: 2; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 4px 4px 0 rgba(35, 48, 58, 0.35); }
      .card .tab { position: absolute; left: -3px; top: -16px; background: var(--tab); border: 3px solid var(--ink); border-radius: 8px; padding: 2px 12px; font: 22px "Patrick Hand SC", cursive; letter-spacing: 0.5px; }
      #head { top: 28px; left: 16px; width: min(340px, calc(100% - 32px)); padding: 22px 14px 12px; }
      #head p { margin: 0 0 8px; font-size: 18px; }
      #search { width: 100%; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 8px; font: 18px "Patrick Hand", cursive; background: #fff; }
      #list { margin: 8px 0 0; padding: 0; list-style: none; max-height: 40vh; overflow: auto; }
      #list li button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 6px; border-radius: 6px; font: 18px "Patrick Hand", cursive; color: var(--ink); cursor: pointer; }
      #list li button:hover, #list li button.on { background: #e8f1fb; }
      #list small { display: block; opacity: 0.65; font-size: 15px; }
      #pick { left: 50%; bottom: 28px; transform: translateX(-50%); width: min(380px, calc(100% - 32px)); padding: 22px 16px 14px; display: none; }
      #pick.show { display: block; }
      #pick h2 { margin: 0; font: 26px "Patrick Hand SC", cursive; }
      #pick p { margin: 2px 0 8px; font-size: 18px; }
      #pick .acts { display: flex; gap: 8px; }
      #pick a { flex: 1; text-align: center; text-decoration: none; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 8px; padding: 5px 8px; font: 20px "Patrick Hand SC", cursive; box-shadow: 2px 2px 0 rgba(35, 48, 58, 0.35); }
      #pick a.go { background: var(--accent); }
      #pick a:hover { transform: translate(-1px, -1px); }
      .pin { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); box-shadow: 2px 2px 0 rgba(35, 48, 58, 0.4); cursor: pointer; }
      .pin.on { background: #d9534a; transform: scale(1.25); }
      #credit { position: absolute; z-index: 1; right: 8px; bottom: 4px; font-size: 13px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <section class="card" id="head" aria-label="Resorts">
      <div class="tab">Choose a mountain</div>
      <p id="count"></p>
      <input id="search" type="search" placeholder="Search resorts…" autocomplete="off" aria-label="Search resorts" />
      <ul id="list"></ul>
    </section>

    <section class="card" id="pick" aria-live="polite">
      <div class="tab" id="pick-tab">Resort</div>
      <h2 id="pick-name"></h2>
      <p id="pick-sub"></p>
      <p id="pick-stats"></p>
      <div class="acts">
        <a class="go" id="go-ride" href="#">Ride it ▸</a>
        <a id="go-dio" href="#">Diorama</a>
      </div>
    </section>

    <p id="credit"></p>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);

      const GP = params.get("data") || "https://globalskiatlas-backend-k8s-output.s3.us-east-1.amazonaws.com/game_play/";

      Promise.all([
        fetch("./data/worlds.json").then((r) => r.json()).catch(() => []),
        fetch(GP + "worlds.json").then((r) => r.json()).then((j) => j.resorts || []).catch(() => []),
      ]).then(([local, remote]) => {
        const byId = new Map();
        for (const w of [...remote, ...local.filter((w) => w.id === "hemu")]) byId.set(w.id, w);
        init([...byId.values()]);
      });

      function init(worlds) {
        $("count").textContent = `${worlds.length.toLocaleString()} playable resort${worlds.length === 1 ? "" : "s"}`;
        const map = new maplibregl.Map({
          container: "map",
          style: "https://tiles.openfreemap.org/styles/liberty",
          center: [0, 25],
          zoom: 1.6,
          minZoom: 1,
          attributionControl: { compact: true },
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

        const byKey = new Map(worlds.map((w) => [w.id, w]));
        let selected = null;
        let marker = null;

        function select(w, fly = true) {
          selected = w;
          marker?.remove();
          const el = document.createElement("div");
          el.className = "pin on";
          marker = new maplibregl.Marker({ element: el }).setLngLat([w.lon, w.lat]).addTo(map);
          for (const b of $("list").querySelectorAll("button")) b.classList.toggle("on", b.dataset.id === w.id);
          $("pick-tab").textContent = "Resort";
          $("pick-name").textContent = w.name;
          $("pick-sub").textContent = w.subtitle || "";
          $("pick-stats").textContent = `${w.runs} runs \u00b7 ${w.lifts} lifts \u00b7 ${w.min.toLocaleString()}\u2013${w.max.toLocaleString()} m`;
          $("go-ride").href = `./play.html?world=${encodeURIComponent(w.id)}`;
          $("go-dio").href = `./diorama.html?world=${encodeURIComponent(w.id)}`;
          $("pick").classList.add("show");
          if (fly) map.flyTo({ center: [w.lon, w.lat], zoom: Math.max(map.getZoom(), 9), speed: 1.4 });
        }

        map.on("load", () => {
          map.addSource("resorts", {
            type: "geojson",
            cluster: true,
            clusterRadius: 38,
            clusterMaxZoom: 9,
            data: {
              type: "FeatureCollection",
              features: worlds.map((w) => ({
                type: "Feature",
                properties: { id: w.id },
                geometry: { type: "Point", coordinates: [w.lon, w.lat] },
              })),
            },
          });
          const ring = { "circle-color": "#f2c14e", "circle-stroke-color": "#23303a", "circle-stroke-width": 2.5 };
          map.addLayer({
            id: "clusters",
            type: "circle",
            source: "resorts",
            filter: ["has", "point_count"],
            paint: { ...ring, "circle-radius": ["step", ["get", "point_count"], 14, 10, 18, 50, 23, 200, 29] },
          });
          map.addLayer({
            id: "cluster-count",
            type: "symbol",
            source: "resorts",
            filter: ["has", "point_count"],
            layout: { "text-field": ["get", "point_count_abbreviated"], "text-size": 13, "text-font": ["Noto Sans Bold"] },
            paint: { "text-color": "#23303a" },
          });
          map.addLayer({
            id: "points",
            type: "circle",
            source: "resorts",
            filter: ["!", ["has", "point_count"]],
            paint: { ...ring, "circle-radius": 8 },
          });
          map.on("click", "clusters", async (e) => {
            const f = map.queryRenderedFeatures(e.point, { layers: ["clusters"] })[0];
            const zoom = await map.getSource("resorts").getClusterExpansionZoom(f.properties.cluster_id);
            map.easeTo({ center: f.geometry.coordinates, zoom: zoom + 0.5 });
          });
          map.on("click", "points", (e) => {
            const w = byKey.get(e.features[0].properties.id);
            if (w) select(w);
          });
          for (const l of ["clusters", "points"]) {
            map.on("mouseenter", l, () => (map.getCanvas().style.cursor = "pointer"));
            map.on("mouseleave", l, () => (map.getCanvas().style.cursor = ""));
          }
        });
        map.on("click", (e) => {
          if (map.getLayer("points") && map.queryRenderedFeatures(e.point, { layers: ["points", "clusters"] }).length) return;
          selected = null;
          marker?.remove();
          $("pick").classList.remove("show");
          for (const b of $("list").querySelectorAll("button")) b.classList.remove("on");
        });

        const renderList = (q = "") => {
          const needle = q.trim().toLowerCase();
          const hits = worlds
            .filter((w) => !needle || `${w.name} ${w.subtitle}`.toLowerCase().includes(needle))
            .sort((a, b) => b.lifts + b.runs - (a.lifts + a.runs));
          $("list").replaceChildren(
            ...hits.slice(0, 80).map((w) => {
              const li = document.createElement("li");
              const b = document.createElement("button");
              b.dataset.id = w.id;
              b.className = selected?.id === w.id ? "on" : "";
              b.textContent = w.name;
              const s = document.createElement("small");
              s.textContent = w.subtitle || "";
              b.append(s);
              b.addEventListener("click", () => select(w));
              li.append(b);
              return li;
            })
          );
        };
        renderList();
        $("search").addEventListener("input", (e) => renderList(e.target.value));

        const bounds = new maplibregl.LngLatBounds();
        worlds.forEach((w) => bounds.extend([w.lon, w.lat]));
        if (worlds.length > 1) map.fitBounds(bounds, { padding: { top: 80, bottom: 120, left: 380, right: 80 }, maxZoom: 5, animate: false });
        else if (worlds[0]) map.jumpTo({ center: [worlds[0].lon, worlds[0].lat], zoom: 5 });
      }
    </script>
  </body>
</html>
