name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node and build Tailwind
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build:tailwind

      - name: Generate auth/config for Cognito (production)
        env:
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
        run: node scripts/generate-auth-config.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://globalskiatlas.com --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude ".gitignore" \
            --exclude "*.md" \
            --exclude "package*.json" \
            --exclude "tailwind.config.js" \
            --exclude "docs/*"

      - name: Verify wiki assets on S3
        run: |
          aws s3api head-object --bucket globalskiatlas.com --key wiki/resort.html
          aws s3 cp s3://globalskiatlas.com/wiki/resort.html - | grep -q 'script.js?v=4' || (echo "S3 wiki/resort.html missing expected script version" && exit 1)

      - name: Refresh wiki cache headers on S3
        run: |
          aws s3 cp wiki/resort.html s3://globalskiatlas.com/wiki/resort.html \
            --content-type text/html \
            --cache-control "public, max-age=300, must-revalidate"
          aws s3 cp wiki/js/script.js s3://globalskiatlas.com/wiki/js/script.js \
            --content-type application/javascript \
            --cache-control "public, max-age=300, must-revalidate"
          aws s3 cp wiki/css/style.css s3://globalskiatlas.com/wiki/css/style.css \
            --content-type text/css \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          echo "CloudFront distributions:"
          aws cloudfront list-distributions \
            --query 'DistributionList.Items[*].{Id:Id,Aliases:Aliases.Items}' \
            --output table
          aws cloudfront create-invalidation --distribution-id E38F9PVDPMHRQK --paths "/*"
          aws cloudfront create-invalidation --distribution-id E38F9PVDPMHRQK --paths "/wiki/*"
          python3 <<'PY'
          import json, subprocess
          out = subprocess.check_output(
              ["aws", "cloudfront", "list-distributions", "--output", "json"],
              text=True,
          )
          data = json.loads(out)
          seen = {"E38F9PVDPMHRQK"}
          for item in (data.get("DistributionList") or {}).get("Items") or []:
              dist_id = item.get("Id")
              aliases = (item.get("Aliases") or {}).get("Items") or []
              if not dist_id or dist_id in seen:
                  continue
              if any("globalskiatlas" in (a or "") for a in aliases):
                  seen.add(dist_id)
                  print(f"Invalidating {dist_id} aliases={aliases}")
                  subprocess.run(
                      [
                          "aws", "cloudfront", "create-invalidation",
                          "--distribution-id", dist_id,
                          "--paths", "/*", "/wiki/*",
                      ],
                      check=True,
                  )
          PY
